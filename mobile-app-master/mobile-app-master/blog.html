<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="description" content="blogs page">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          crossorigin="anonymous">

    <!-- Custom styles -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web:200,300,600" rel="stylesheet">

    <!-- Ionic icons -->
    <link href="https://unpkg.com/ionicons@4.5.5/dist/css/ionicons.min.css" rel="stylesheet">

    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.png" />

    <title>Blog | Mobile App</title>
</head>

<body role="main">

<!-- Fetchable Header -->
<div id="header"></div>

<!-- Blog Intro -->
<section id="intro" class="bg-light">
    <div class="container">
        <div class="heading-block">
            <h1>Our Blog</h1>
            <p>
                Insights, updates, and best practices to help you build,
                launch, and scale better mobile applications.
            </p>
        </div>
    </div>
</section>

<!-- Blog Content -->
<section class="bg-white">
    <div class="container">
        <div class="row topmargin-lg" id="blog-list">
            <!-- Blog cards injected by JS -->
        </div>
    </div>
</section>

<!-- CTA -->
<section class="bg-dark divider">
    <div class="container text-center">
        <div class="heading-block">
            <h3 class="text-light">Stay updated</h3>
            <p class="text-light">
                Subscribe to get the latest product updates and articles.
            </p>
            <a href="#" class="primary-btn">Subscribe Now</a>
        </div>
    </div>
</section>

<!-- Fetchable Footer -->
<div id="footer"></div>

<!-- JavaScript -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        crossorigin="anonymous"></script>

<script src="assets/js/custom.js"></script>
<script src="assets/js/blog.js"></script>
<script src="assets/js/features.js"></script>

</body>
</html>
